[mypy]
# F7 audit-v4 (2026-05-08): mypy strict para módulos puros del proyecto.
# Solo cubre módulos sin dependencia ROS (rclpy, geometry_msgs, etc.) que
# son tested unit y forman la base de la lógica del orchestrator.
#
# Usage:
#   cd agarre_ros2_ws && mypy --config-file mypy.ini --strict \
#     src/tfm_orchestrator/tfm_orchestrator/pick_gates.py \
#     src/tfm_orchestrator/tfm_orchestrator/retry.py \
#     src/tfm_orchestrator/tfm_orchestrator/pose_consistency.py
#
# Roadmap: ampliar a phase_dispatch, initial_snapshot, home_initial, etc.
# en F7-step2 cuando se rebajen los Any externos.

python_version = 3.12

# Strict global flags (equivalente a --strict).
warn_unused_configs = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
strict_concatenate = True

# Excluir tests + builds.
exclude = (?x)(
    /test/
    | /build/
    | /install/
    | /log/
  )

# Stubs faltantes: módulos ROS y similares se ignoran (tienen sus propios
# stubs en /opt/ros/<distro>/lib/python3.X/site-packages que no siempre
# son strict-friendly).
[mypy-rclpy.*]
ignore_missing_imports = True

[mypy-geometry_msgs.*]
ignore_missing_imports = True

[mypy-trajectory_msgs.*]
ignore_missing_imports = True

[mypy-control_msgs.*]
ignore_missing_imports = True

[mypy-moveit_msgs.*]
ignore_missing_imports = True

[mypy-std_msgs.*]
ignore_missing_imports = True

[mypy-sensor_msgs.*]
ignore_missing_imports = True

[mypy-tf2_ros.*]
ignore_missing_imports = True

[mypy-builtin_interfaces.*]
ignore_missing_imports = True

[mypy-ur5_panel_interfaces.*]
ignore_missing_imports = True

[mypy-shape_msgs.*]
ignore_missing_imports = True

[mypy-action_msgs.*]
ignore_missing_imports = True

[mypy-rcl_interfaces.*]
ignore_missing_imports = True

[mypy-lifecycle_msgs.*]
ignore_missing_imports = True

[mypy-ros_gz_interfaces.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-numpy]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-cv_bridge.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-ament_index_python.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True

[mypy-rosgraph_msgs.*]
ignore_missing_imports = True

[mypy-tf2_geometry_msgs.*]
ignore_missing_imports = True

[mypy-tf2_msgs.*]
ignore_missing_imports = True
