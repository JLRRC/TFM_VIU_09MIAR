# Ruta/archivo: agarre_ros2_ws/models/ur5_rg2/ur5_controllers.yaml
# Contenido: Recurso de modelo de simulacion para Gazebo.
# Uso breve: Gazebo lo carga como parte del entorno del workspace ROS 2.
# URL: /home/laboratorio/TFM/agarre_ros2_ws/src/ur5_description/config/ur5_controllers.yaml
# Summary: Controller configuration for UR5 and RG2 gripper.
controller_manager:
  ros__parameters:
    update_rate: 125

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_position_controller:
      type: forward_command_controller/ForwardCommandController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: true
    speed_scaling:
      initial_scaling_factor: 1.0
      state_interface: ""
      command_interface: ""
    # 2026-05-07: tolerancias subidas para Gazebo Sim (sim_per_wall ≈ 0.58
    # produce drift severo). Ronda 15 mostró goal_time_tolerance exceeding
    # by 30s — robot NO sigue trayectoria con precisión en sim.
    # - trajectory: 6.28 (vuelta entera)
    # - goal: 0.30 (17°)
    # - goal_time: 300.0 — permite sim lento sin abortar
    # - stopped_velocity_tolerance: 0.10
    constraints:
      stopped_velocity_tolerance: 0.10
      goal_time: 300.0
      shoulder_pan_joint:
        trajectory: 6.28
        goal: 0.30
      shoulder_lift_joint:
        trajectory: 6.28
        goal: 0.30
      elbow_joint:
        trajectory: 6.28
        goal: 0.30
      wrist_1_joint:
        trajectory: 6.28
        goal: 0.30
      wrist_2_joint:
        trajectory: 6.28
        goal: 0.30
      wrist_3_joint:
        trajectory: 6.28
        goal: 0.30

arm_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: position

gripper_controller:
  ros__parameters:
    joints:
      - rg2_finger_joint1
      - rg2_finger_joint2
    interface_name: position
