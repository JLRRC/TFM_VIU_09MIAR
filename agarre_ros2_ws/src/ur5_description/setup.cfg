# F4 (auditoría 2026-05-10): activación de ament_flake8/pep257.
#
# Snapshot de deuda al activar:
#   - Q000 (~70): comillas estilísticas.
#   - D* (~10): docstrings (tests).
#   - I* (~5): import order.

[flake8]
max-line-length = 99
extend-ignore =
    E203,
    W503,
    Q000,
    D100,
    D101,
    D102,
    D103,
    D104,
    D105,
    D107,
    D200,
    D205,
    D209,
    D400,
    D401,
    D403,
    I100,
    I101,
    I201
exclude =
    build,
    install,
    log,
    .git,
    __pycache__
