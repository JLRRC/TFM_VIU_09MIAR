# Contenido: Descripcion URDF/Xacro y configuracion base del robot UR5.
# Uso breve: Se usa al publicar el robot model y al preparar simulacion y MoveIt.
# URL: /home/laboratorio/TFM/agarre_ros2_ws/src/ur5_description/config/ur5_controllers.yaml
# Summary: Controller configuration for UR5 and RG2 gripper.
controller_manager:
  ros__parameters:
    update_rate: 125

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: forward_command_controller/ForwardCommandController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    set_last_command_interface_value_as_state_on_activation: true
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
      shoulder_pan_joint:
        trajectory: 100.0
        goal: 0.08
      shoulder_lift_joint:
        trajectory: 100.0
        goal: 0.08
      elbow_joint:
        trajectory: 100.0
        goal: 0.08
      wrist_1_joint:
        trajectory: 100.0
        goal: 0.08
      wrist_2_joint:
        trajectory: 100.0
        goal: 0.08
      wrist_3_joint:
        trajectory: 100.0
        goal: 0.08


gripper_controller:
  ros__parameters:
    joints:
      - rg2_finger_joint1
      - rg2_finger_joint2
    interface_name: position
