[flake8]
# Heredado de /opt/ros/jazzy/lib/python3.12/site-packages/ament_flake8/configuration/ament_flake8.ini
# + extensiones locales para tolerar mismatch de estilo en codebase legacy.
#
# Q000/Q002/Q003: codebase usa double quotes consistentemente.
# I100/I101/I201: orden de imports manual por bloques semanticos.
# F841: variable asignada no usada (tolerado en tests legacy).
# E702/E231/E306/E122/E203/W292/D202/D204/C414: estilo en tests con tunables
# (semicolons one-liner, blank lines, etc.) y assertion comparisons. Deuda
# tecnica documentada — no funcional.
# E402/E501: imports no-top y line-too-long en tests con setup defensivo.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000,Q002,Q003,I100,I101,I201,F841,E702,D202,E501,E231,E402,D204,E203,W292,E306,E122,C414
import-order-style = google
max-line-length = 120
show-source = true
statistics = true
