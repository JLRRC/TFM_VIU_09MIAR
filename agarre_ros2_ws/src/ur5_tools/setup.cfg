# Ruta/archivo: agarre_ros2_ws/src/ur5_tools/setup.cfg
# Contenido: Codigo de herramientas, bridges y servicios auxiliares del stack UR5.
# Uso breve: Se usa en build con colcon y como nodos/servicios ROS 2 del sistema.
# URL: /home/laboratorio/TFM/agarre_ros2_ws/src/ur5_tools/setup.cfg
# Summary: Setuptools script install locations for ur5_tools.
[develop]
script_dir=$base/lib/ur5_tools
[install]
install_scripts=$base/lib/ur5_tools

[options.entry_points]
console_scripts =
    ur5_moveit_bridge = ur5_tools.ur5_moveit_bridge:main
    release_objects_service = ur5_tools.release_objects_service:main

[flake8]
max-line-length = 120
extend-ignore = E203, W503
# Codebase usa double quotes consistentemente; flake8-quotes default es single.
inline-quotes = double
multiline-quotes = double
docstring-quotes = double
# I100/I101/I201 (import order) son demasiado estrictos para refactor incremental.
# F841 (local variable not used) ya cubierto por reviews; tolerar en tests legacy.
per-file-ignores =
    test/*:F841,I100,I101,I201
    src/ur5_tools/*:I100,I101,I201

[pydocstyle]
# F1 (audit 2026-05-10): D205/D209/D400/D401 son tolerancias de estilo
# coherentes con D102/D107 ya ignorados (proyecto científico, prioriza
# claridad técnica sobre estilo formal de docstring).
add-ignore = D102, D107, D205, D209, D400, D401
