# F4 (auditoría 2026-05-10): activación de ament_flake8/pep257.
#
# Configuración inicial conservadora — los códigos en `extend-ignore`
# están en la lista por deuda histórica documentada. La intención es
# reducir esta lista incrementalmente en F6+ a medida que el código
# se limpie.
#
# Snapshot de deuda al activar el lint:
#   - Q000 (1937): comillas (flake8-quotes prefiere simples; el código
#     usa dobles como en el resto del workspace).
#   - D* (~75): pydocstyle/PEP 257 — docstrings ausentes o sin punto
#     final. Se irán añadiendo en cada refactor de la fase F6.
#   - I* (~25): import order. Pendiente unificar con isort.
#   - E402 (14): module-level imports no al tope (necesario en algunos
#     launch files que insertan sys.path antes del import).

# max-line-length=120: justificado para launch files con paths largos
# de Gazebo + composición de IncludeLaunchDescription. F6/F9 reducirá
# las líneas más egregias durante el split de ur5_stack.launch.py.
[flake8]
max-line-length = 120
extend-ignore =
    E203,
    W503,
    Q000,
    D100,
    D101,
    D102,
    D103,
    D104,
    D105,
    D107,
    D200,
    D205,
    D209,
    D301,
    D400,
    D401,
    D403,
    E402,
    E741,
    I100,
    I101,
    I201
exclude =
    build,
    install,
    log,
    .git,
    __pycache__
