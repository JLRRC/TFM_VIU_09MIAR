# Ruta/archivo: .pre-commit-config.yaml
# Contenido: Hooks pre-commit para TFM (ruff + checks básicos).
# Uso breve:
#   pip install pre-commit ruff
#   pre-commit install
#   pre-commit run --all-files   # primera ejecución manual
#
# Nota FASE 1 (2026-05-02): hooks en modo check-only para no bloquear
# commits del refactor en curso. El selector ruff de pyproject.toml está
# acotado a errores graves (sintaxis, undefined names, mutable defaults).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, check-only)
        args: [--no-fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(BORRAR|historico|auditoria|report)/'
      - id: end-of-file-fixer
        exclude: '^(BORRAR|historico|auditoria|report)/'
      - id: check-yaml
        exclude: '^(BORRAR|historico|auditoria|report|agarre_inteligente)/'
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml

  # F4 audit-v4 (2026-05-08): quality meta-tests gate (rápido, ~1s).
  # Bloquea commit si:
  #   * print() en archivo no listado en LEGACY_PRINT_FILES.
  #   * archivo .py crece más de +50 LOC sobre baseline LEGACY_OVERSIZE.
  #   * función nueva > 200 LOC.
  #   * import circular.
  #   * env var sin documentar en *_params.py.
  #   * env reads scattered > baseline (T31).
  - repo: local
    hooks:
      - id: quality-metrics
        name: F4 quality meta-tests (LOC, prints, env reads)
        entry: pytest agarre_ros2_ws/src/ur5_qt_panel/test/test_quality_metrics.py -q --no-header
        language: system
        pass_filenames: false
        files: \.py$
        always_run: false

      - id: mypy-strict-baseline
        name: F7 mypy strict baseline (23 módulos puros)
        entry: pytest agarre_ros2_ws/src/tfm_orchestrator/test/test_mypy_strict_baseline.py -q --no-header
        language: system
        pass_filenames: false
        files: \.(py|ini)$
        always_run: false

      - id: bridge-regression-guard
        name: F1.5 T28 bridge retry regression guard (AST)
        entry: pytest agarre_ros2_ws/src/ur5_tools/test/test_bridge_path_tolerance_regression.py -q --no-header
        language: system
        pass_filenames: false
        files: 'agarre_ros2_ws/src/ur5_tools/ur5_tools/plan_to_pose_server\.py'
        always_run: false

      # Audit 2026-05-10 (Action 23): hooks de regresión arquitectónica
      # del plan 100/100 (Acciones 7, 8, 9).
      - id: launch-no-dup-defs
        name: Action 8 — no duplicate top-level defs en launch (B1 guard)
        entry: pytest agarre_ros2_ws/src/ur5_bringup/test/test_launch_no_dup_defs.py -q --no-header
        language: system
        pass_filenames: false
        files: 'agarre_ros2_ws/src/.+/launch/.+\.py$'
        always_run: false

      - id: urdf-frame-uniqueness
        name: Action 8 — URDF sin frames hermanos parent+origin idénticos (B2 guard)
        entry: pytest agarre_ros2_ws/src/ur5_description/test/test_urdf_frame_uniqueness.py -q --no-header
        language: system
        pass_filenames: false
        files: 'agarre_ros2_ws/src/ur5_description/urdf/.+\.xacro$'
        always_run: false

      - id: runtime-defaults-consumed
        name: Action 8 — runtime_defaults.yaml sin keys huérfanas
        entry: pytest agarre_ros2_ws/src/ur5_bringup/test/test_runtime_defaults_consumed.py -q --no-header
        language: system
        pass_filenames: false
        files: 'agarre_ros2_ws/src/ur5_bringup/config/runtime_defaults\.yaml$|\.py$|\.yaml$'
        always_run: false

      - id: lifecycle-contract
        name: Action 9 — contract offline de los 8 LifecycleNodes
        entry: pytest agarre_ros2_ws/src/ur5_tools/test/test_lifecycle_contract_offline.py -q --no-header
        language: system
        pass_filenames: false
        files: '(gripper_attach_backend|gz_pose_bridge|object_pose_resolver_service|release_objects_service|system_state_manager|tf_geometry_service|world_tf_publisher|pick_orchestrator_lifecycle_node)\.py$'
        always_run: false

      - id: moveit-config-integrity
        name: Action 7 — moveit_config YAMLs + SRDFs estructura válida
        entry: pytest agarre_ros2_ws/src/ur5_moveit_config/test/test_config_integrity.py -q --no-header
        language: system
        pass_filenames: false
        files: 'agarre_ros2_ws/src/ur5_moveit_config/config/.+\.(yaml|srdf)$'
        always_run: false
