# Ruta/archivo: .github/workflows/colcon-full.yml
# Contenido: Build + test colcon completo (requiere ROS 2 Jazzy + deps).
# Uso breve: trigger manual (workflow_dispatch) o push a main/ENTREGA.V3.
#
# F4.4 audit (2026-05-10):
#   * Migrado a ros:jazzy-desktop (incluye MoveIt + ros_gz + ur_description).
#     Eliminado el comentario "puede dejarse rojo": ya no es aceptable.
#   * Añadidas deps explícitas para PyQt5/Xvfb (smoke headless del panel).
#   * Cobertura subida como artifact CI (P-18).
#   * Para CI verde rápido del subset offline de ur5_qt_panel ver el
#     workflow colcon.yml (job offline-tests).

name: colcon-full

on:
  push:
    branches:
      - main
      - ENTREGA.V3
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    container:
      # F4.4 audit (2026-05-10): jazzy-desktop incluye MoveIt + ros_gz.
      image: osrf/ros:jazzy-desktop
      options: --user root

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install runtime deps (PyQt5 + Xvfb + coverage)
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pyqt5 python3-pyqt5.qtwebengine \
            xvfb x11-utils \
            python3-pip \
            ros-jazzy-gz-ros2-control \
            ros-jazzy-ros-gz-bridge ros-jazzy-ros-gz-sim \
            ros-jazzy-moveit-py \
            ros-jazzy-controller-manager-msgs \
            ros-jazzy-control-msgs
          pip3 install --break-system-packages mypy==1.11.2 pytest-cov coverage \
            || pip3 install mypy==1.11.2 pytest-cov coverage

      - name: Install rosdep deps (best-effort)
        shell: bash
        working-directory: agarre_ros2_ws
        run: |
          set -euo pipefail
          rosdep update --rosdistro=jazzy || true
          rosdep install --from-paths src --ignore-src \
            --rosdistro=jazzy -y \
            --skip-keys "PyQt5 python3-pyqt5 python3-pyqt5.qtwebengine xvfb" \
            || true

      - name: colcon build (todos los paquetes del workspace)
        shell: bash
        working-directory: agarre_ros2_ws
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select \
              ur5_panel_interfaces \
              ur5_description \
              ur5_moveit_config \
              ur5_bringup \
              ur5_tools \
              tfm_grasping \
              tfm_orchestrator \
              ur5_qt_panel \
            --event-handlers console_direct+

      - name: colcon test con cobertura
        shell: bash
        working-directory: agarre_ros2_ws
        env:
          QT_QPA_PLATFORM: offscreen
          DISPLAY: ":99"
        run: |
          set -euo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # F4.4: Xvfb para tests Qt (smoke).
          Xvfb :99 -screen 0 1280x1024x24 &
          XVFB_PID=$!
          sleep 1
          colcon test \
            --packages-select \
              ur5_tools \
              ur5_bringup \
              tfm_grasping \
              tfm_orchestrator \
              ur5_moveit_config \
              ur5_qt_panel \
            --event-handlers console_direct+ \
            --pytest-args -q
          colcon test-result --verbose
          kill $XVFB_PID 2>/dev/null || true

      - name: Generate coverage report
        if: always()
        shell: bash
        working-directory: agarre_ros2_ws
        run: |
          set -euo pipefail
          coverage combine .coverage* 2>/dev/null || true
          coverage html -d coverage_html 2>/dev/null || true
          coverage xml -o coverage.xml 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: agarre_ros2_ws/build/*/pytest.xml
          retention-days: 14

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: |
            agarre_ros2_ws/coverage_html/
            agarre_ros2_ws/coverage.xml
          retention-days: 14
          if-no-files-found: ignore
