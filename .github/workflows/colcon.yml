# Ruta/archivo: .github/workflows/colcon.yml
# Contenido: CI rápido — pytest del subset offline (sin ROS, sin Qt).
# Uso breve: dispara en push y PR a cualquier rama. Tiempo < 1 min.
#
# Notas:
#   * Cubre los 6 dataclasses *_params.py (PickDemo, PickObject, PanelRos,
#     PanelUi, MoveItBridge, PanelTfm) + helpers puros (pure_helpers,
#     ros_msg_helpers, directo_geometry). ~198 tests.
#   * NO requiere PyQt5, ROS, Gazebo ni rclpy.
#   * Para el build colcon completo (con container ROS 2 Jazzy), ver
#     colcon-full.yml (manual / push a main).

name: colcon

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest + PyYAML + PyQt5 (Qt headless smoke)
        run: pip install pytest pyyaml PyQt5

      - name: pytest offline subset ur5_qt_panel
        working-directory: agarre_ros2_ws/src/ur5_qt_panel
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_panel_pick_demo_params.py \
            test/test_panel_pick_object_params.py \
            test/test_panel_ros_params.py \
            test/test_panel_ui_params.py \
            test/test_panel_tfm_params.py \
            test/test_pick_demo_pure_helpers.py \
            test/test_panel_ros_msg_helpers.py \
            test/test_directo_geometry.py \
            test/test_pick_place_client_logic.py \
            test/test_pick_demo_dispatcher.py \
            test/test_orientation_helpers.py \
            test/test_pick_demo_metrics.py \
            test/test_pick_demo_geometry.py \
            test/test_pick_demo_phase_checks.py \
            test/test_pick_object_parsing.py \
            test/test_panel_ros_handlers.py \
            test/test_pick_object_wait_helpers.py \
            test/test_panel_v2_helpers.py \
            test/test_panel_v2_publisher_mixin.py \
            test/test_panel_v2_base_pose_mixin.py \
            test/test_panel_v2_gripper_attach_mixin.py \
            test/test_panel_v2_motion_mixin.py \
            test/test_panel_v2_traj_settle_mixin.py \
            test/test_panel_v2_system_state_mixin.py \
            test/test_panel_clock_helpers.py \
            test/test_pick_object_diagnostics.py \
            test/test_panel_v2_step_debug_mixin.py \
            test/test_panel_v2_runtime_diagnostics_mixin.py \
            test/test_panel_v2_subprocess_motion_mixin.py \
            test/test_panel_v2_audit_log_mixin.py \
            test/test_panel_v2_tfm_remote_mixin.py \
            test/test_panel_v2_ready_reasons_mixin.py \
            test/test_panel_v2_droprecover_mixin.py \
            test/test_panel_v2_calibpick_mixin.py \
            test/test_panel_v2_overlaysselection_mixin.py \
            test/test_panel_v2_tfmsciencetrace_mixin.py \
            test/test_panel_tf_geometry_client_logic.py \
            test/test_logging_utils.py \
            test/test_quality_metrics.py

      - name: pytest T18 Qt headless smoke (panel_v2 offscreen)
        working-directory: agarre_ros2_ws/src/ur5_qt_panel
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q test/test_panel_v2_qt_smoke.py

      - name: pytest offline subset ur5_tools (F4/F10/F6.5/F13 helpers puros)
        working-directory: agarre_ros2_ws/src/ur5_tools
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_evidence_logger_offline.py \
            test/test_gripper_geometry_contract.py \
            test/test_attach_backend_imports.py \
            test/test_plan_to_pose_logic.py \
            test/test_moveit_bridge_log_formatters.py \
            test/test_lifecycle_contract.py \
            test/test_evidence_telemetry_f18.py \
            test/test_tf_geometry_logic.py \
            test/test_perf_helpers.py \
            test/test_no_print_in_tools.py

      - name: pytest no-print-in-prod gating (ur5_qt_panel)
        working-directory: agarre_ros2_ws/src/ur5_qt_panel
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_no_print_in_panel.py

      - name: pytest tfm_orchestrator (F5 FSM + F6 service clients + F8 timings + T29 GRASP_DOWN)
        working-directory: agarre_ros2_ws/src/tfm_orchestrator
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_pick_fsm.py \
            test/test_service_clients.py \
            test/test_phase_timings.py \
            test/test_lifecycle_helpers.py \
            test/test_grasp_down_phase_in_fsm.py \
            test/test_pick_gates.py

      - name: pytest ur5_bringup (F17 launch + T4 schemas + T26 grasp evidence + T30 release integrity)
        working-directory: agarre_ros2_ws/src/ur5_bringup
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_launch_factories.py \
            test/test_yaml_schemas.py \
            test/test_grasp_evidence_regression.py \
            test/test_release_integrity.py

      - name: pytest ur5_bringup audit-v4 schemas + jsonschema drift
        working-directory: agarre_ros2_ws/src/ur5_bringup
        env:
          PYTHONPATH: .
        run: |
          pip install jsonschema
          pytest -q \
            test/test_yaml_jsonschema.py \
            test/test_yaml_env_consistency.py \
            test/test_grasp_selector_launch.py

      - name: pytest ur5_description URDF/Xacro structural
        working-directory: agarre_ros2_ws/src/ur5_description
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_urdf_xacro_parses.py

      - name: pytest ur5_panel_interfaces IDL inventory
        working-directory: agarre_ros2_ws/src/ur5_panel_interfaces
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_idl_inventory.py

      - name: pytest tfm_orchestrator typed errors
        working-directory: agarre_ros2_ws/src/tfm_orchestrator
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_errors.py

      - name: pytest panel_v2 MRO + UI LOC baselines (audit-v4)
        working-directory: agarre_ros2_ws/src/ur5_qt_panel
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_panel_v2_mro.py \
            test/test_ui_files_loc_baseline.py \
            test/test_internal_helpers_snapshot.py \
            test/test_panel_helpers_snapshot.py \
            test/test_panel_ros_snapshot.py \
            test/test_pick_object_snapshot.py \
            test/test_no_environ_drift.py

      # ---------------------------------------------------------------
      # Audit 2026-05-10 (Actions 7, 8, 9, 10): tests nuevos del plan
      # 100/100. Bloquean regresión arquitectónica B1, B2 y huérfanos
      # de runtime_defaults.yaml + lifecycle contract de los 8 nodos.
      # ---------------------------------------------------------------
      - name: pytest moveit_config integrity (Action 7)
        working-directory: agarre_ros2_ws/src/ur5_moveit_config
        run: |
          pytest -q test/test_config_integrity.py

      - name: pytest architectural regression (Action 8)
        working-directory: agarre_ros2_ws/src/ur5_bringup
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            test/test_launch_no_dup_defs.py \
            test/test_runtime_defaults_consumed.py

      - name: pytest URDF frame uniqueness (Action 8)
        working-directory: agarre_ros2_ws/src/ur5_description
        run: |
          pytest -q test/test_urdf_frame_uniqueness.py

      - name: pytest lifecycle contract offline x8 (Action 9)
        working-directory: agarre_ros2_ws/src/ur5_tools
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_lifecycle_contract_offline.py

      # ---------------------------------------------------------------
      # F4 audit (2026-05-10): tests nuevos del plan F0-F10.
      # ---------------------------------------------------------------
      - name: pytest geometry YAML consistency (F2.3)
        working-directory: agarre_ros2_ws/src/ur5_tools
        env:
          PYTHONPATH: .
        run: |
          pytest -q test/test_geometry_yaml_consistency.py

      - name: pytest moveit controllers design contract (F4.1)
        working-directory: agarre_ros2_ws/src/ur5_moveit_config
        run: |
          pytest -q test/test_moveit_controllers_design.py

      - name: pytest panel no runtime subprocess (F4.2)
        working-directory: agarre_ros2_ws
        env:
          PYTHONPATH: src/ur5_qt_panel
        run: |
          pytest -q src/ur5_qt_panel/test/test_panel_no_runtime_subprocess.py

      - name: pytest env vars documented (F4.3)
        working-directory: agarre_ros2_ws
        env:
          PYTHONPATH: src/ur5_bringup
        run: |
          pytest -q src/ur5_bringup/test/test_env_vars_documented.py

      # ---------------------------------------------------------------
      # F4.4 audit (2026-05-10): coverage del subset offline subido como
      # artifact CI (resuelve P-18: cobertura visible en cada PR).
      # ---------------------------------------------------------------
      - name: Run coverage on offline subset
        working-directory: agarre_ros2_ws
        env:
          PYTHONPATH: src/ur5_qt_panel:src/ur5_tools:src/ur5_bringup:src/tfm_orchestrator
        run: |
          pip install coverage
          coverage run --source=src/tfm_orchestrator/tfm_orchestrator,src/ur5_tools/ur5_tools,src/ur5_qt_panel/ur5_qt_panel \
            -m pytest -q \
              src/tfm_orchestrator/test/test_pick_fsm.py \
              src/tfm_orchestrator/test/test_pick_gates.py \
              src/tfm_orchestrator/test/test_phase_timings.py \
              src/ur5_tools/test/test_geometry_yaml_consistency.py \
              src/ur5_tools/test/test_workspace_paths.py \
              src/ur5_qt_panel/test/test_panel_no_runtime_subprocess.py \
              src/ur5_bringup/test/test_env_vars_documented.py \
            || true
          coverage html -d coverage_html || true
          coverage xml -o coverage.xml || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-offline
          path: |
            agarre_ros2_ws/coverage_html/
            agarre_ros2_ws/coverage.xml
          retention-days: 14
          if-no-files-found: ignore
