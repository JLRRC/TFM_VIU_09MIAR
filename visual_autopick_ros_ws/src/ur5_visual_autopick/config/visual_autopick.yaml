# visual_autopick.yaml — configuration for ur5_visual_autopick node
# Stack principal must be running before starting this workspace.

camera_topic: /camera_overhead/image
pose_info_topic: /world/ur5_mesa_objetos/pose/info
world_frame: world
base_frame: base_link
tcp_frame: rg2_pinch_center
object_name: pick_demo

auto_start: false
require_user_arm: true
one_shot: true

tf_max_age_sec: 0.5
image_min_frames: 3
image_max_age_sec: 1.0
object_pose_max_age_sec: 1.0

approach_z_offset_m: 0.035
grasp_z_offset_m: 0.005
lift_z_offset_m: 0.080

approach_tolerance_m: 0.020
grasp_xy_tolerance_m: 0.020
grasp_z_tolerance_m: 0.020
grasp_dist_tolerance_m: 0.030
lift_min_delta_z_m: 0.050

workspace_limits:
  base_x_min: 0.20
  base_x_max: 0.70
  base_y_min: -0.30
  base_y_max: 0.30
  base_z_min: 0.00
  base_z_max: 0.30

moveit:
  backend: existing_bridge
  service_name: /ur5_moveit_bridge/move_tcp
  planning_group: ur_manipulator
  tcp_frame: rg2_pinch_center
  velocity_scale: 0.20
  acceleration_scale: 0.20
  timeout_sec: 10.0

gripper:
  command_topic: /gripper_controller/commands
  joint1: rg2_finger_joint1
  joint2: rg2_finger_joint2
  open_position: 1.0
  closed_position: 0.0
  close_timeout_sec: 4.0
  min_close_delta_sum: 0.01
